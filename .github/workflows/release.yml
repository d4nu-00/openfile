name: Release
# Pushing a tag such as v0.1.0 builds the installers for macOS, Windows and
# Linux and attaches them to a draft GitHub Release, whose notes come from
# docs/releases/<tag>.md. Publish the draft by hand once it is checked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
      - name: Create or find the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${TAG}.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" -f name="OpenFile ${TAG}" \
              -F draft=true -F body=@"$notes" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app for Apple Silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          # The oldest supported Ubuntu, so the packages run on older glibc.
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable revision
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.targets }}
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build and attach the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
