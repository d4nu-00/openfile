[workspace]
members = ["crates/chess-core", "crates/cbh-reader", "crates/engine", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
shakmaty = "0.30"
pgn-reader = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
