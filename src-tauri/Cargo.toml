[package]
name = "chess-workbench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[lib]
name = "chess_workbench"
crate-type = ["lib", "cdylib", "staticlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
shakmaty.workspace = true
shakmaty-syzygy = "0.28"
chess-core = { path = "../crates/chess-core" }
engine = {path = "../crates/engine"}
cbh-reader = { path = "../crates/cbh-reader" }
tempfile.workspace = true
same-file = "1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Debug builds on macOS can snapshot their own web view (`--snapshot`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
[dev-dependencies]
